<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Community Libraries - B4X Resource Navigator</title>
    <link rel="icon" type="image/png" href="favicon-32x32.png" sizes="32x32">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header class="site-header">
        <div class="header-content">
            <a href="https://www.b4x.com" target="_blank" rel="noopener" class="logo" title="B4X Official Site"><img src="Logo_white.png" alt="B4X" height="35"></a>
            <div class="header-center">
                <nav class="main-nav">
                    <a href="index.html" id="navHome">🏠 首页</a>
                    <a href="official.html" id="navOfficial">📚 官方索引</a>
                    <a href="community.html" class="active" id="navCommunity">🧩 社区集合</a>
                </nav>
            </div>
            <div class="header-right">
                <a href="https://github.com/benyuz/b4xlibs" target="_blank" rel="noopener" class="github-link" title="GitHub">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/></svg>
                </a>
                <div class="lang-selector">
                    <select id="langSelect" onchange="changeLanguage(this.value)">
                        <option value="zh-CN">中文</option>
                        <option value="en">English</option>
                    </select>
                </div>
            </div>
        </div>
    </header>

    <main class="container">
        <h2 id="pageTitle">🧩 社区集合</h2>
        <p class="subtitle" id="pageSubtitle">由社区爱好者维护的资源集合</p>
        
        <div class="sticky-filter">
            <div class="filter-bar">
                <input type="text" id="searchInput" placeholder="🔍 搜索库名、描述或作者..." oninput="onSearchInput()">
                <div class="filter-tags">
                    <button class="filter-btn active" data-platform="ALL" onclick="setPlatform('ALL')" id="filterAll">全部</button>
                    <button class="filter-btn" data-platform="B4A" onclick="setPlatform('B4A')" id="filterB4A">B4A</button>
                    <button class="filter-btn" data-platform="B4I" onclick="setPlatform('B4I')" id="filterB4I">B4I</button>
                    <button class="filter-btn" data-platform="B4J" onclick="setPlatform('B4J')" id="filterB4J">B4J</button>
                    <button class="filter-btn" data-platform="B4R" onclick="setPlatform('B4R')" id="filterB4R">B4R</button>
                </div>
            </div>
        </div>
        
        <div id="authorBadge" class="author-badge" style="display:none">
            <span id="authorBadgeText"></span>
            <button class="badge-close" onclick="clearAuthor()" title="清除作者筛选">✕</button>
        </div>
        
        <div id="libraryList" class="library-list"><div class="loading" id="listLoading">⏳ 加载数据中...</div></div>
        <div id="pagination" class="pagination-container"></div>
    </main>

    <footer class="site-footer">
        <p id="footerCredit">♥ B4X 资料库 · 数据每日自动更新</p>
        <p><span id="footerUpdateLabel">🔄 更新时间：</span><span id="updateTime">--</span></p>
        <p><a href="https://github.com/benyuz/b4xlibs" id="footerGitHub"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" style="vertical-align:middle;margin-right:4px"><path d="M12 2C6.477 2 2 6.477 2 12c0 4.42 2.865 8.166 6.839 9.489.5.092.682-.217.682-.482 0-.237-.008-.866-.013-1.7-2.782.603-3.369-1.34-3.369-1.34-.454-1.156-1.11-1.463-1.11-1.463-.908-.62.069-.608.069-.608 1.003.07 1.531 1.03 1.531 1.03.892 1.529 2.341 1.087 2.91.831.092-.646.35-1.086.636-1.336-2.22-.253-4.555-1.11-4.555-4.943 0-1.091.39-1.984 1.029-2.683-.103-.253-.446-1.27.098-2.647 0 0 .84-.269 2.75 1.026A9.578 9.578 0 0112 6.836c.85.004 1.705.114 2.504.336 1.909-1.295 2.747-1.026 2.747-1.026.546 1.377.203 2.394.1 2.647.64.699 1.028 1.592 1.028 2.683 0 3.842-2.339 4.687-4.566 4.935.359.309.678.919.678 1.852 0 1.336-.012 2.415-.012 2.743 0 .267.18.578.688.48C19.138 20.163 22 16.418 22 12c0-5.523-4.477-10-10-10z"/></svg>GitHub 仓库</a></p>
    </footer>

    <button class="back-to-top" id="backToTop" onclick="scrollToTop()">TOP</button>

    <script src="js/locale.js"></script>
    <script src="js/b4x-library.js"></script>
    <script>
    const lang = Locale.detectLanguage();
    const t = Locale.getLocale(lang);
    
    let allData = [];
    let currentPlatform = 'ALL';
    let currentAuthor = '';
    let currentPage = 1;
    const PAGE_SIZE = 20;

    function applyLocale() {
        document.getElementById('langSelect').value = lang;
        document.title = t.header.communityTitle;
        document.getElementById('navHome').textContent = t.nav.home;
        document.getElementById('navOfficial').textContent = t.nav.official;
        document.getElementById('navCommunity').textContent = t.nav.community;
        document.getElementById('pageTitle').textContent = t.entry.communityTitle;
        document.getElementById('pageSubtitle').textContent = t.entry.communityDesc;
        document.getElementById('searchInput').placeholder = t.filter.placeholder;
        document.getElementById('filterAll').textContent = t.filter.all;
        document.getElementById('filterB4A').textContent = t.filter.b4a;
        document.getElementById('filterB4I').textContent = t.filter.b4i;
        document.getElementById('filterB4J').textContent = t.filter.b4j;
        document.getElementById('filterB4R').textContent = t.filter.b4r;
        document.getElementById('listLoading').textContent = t.empty.loading;
        document.getElementById('footerCredit').textContent = t.footer.credit;
        document.getElementById('footerUpdateLabel').textContent = t.footer.update;
        document.getElementById('footerGitHub').innerHTML = t.footer.github;
        document.documentElement.lang = lang;
    }

    function changeLanguage(newLang) {
        Locale.setLanguage(newLang);
    }

    function scrollToTop() {
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    window.addEventListener('scroll', () => {
        const btn = document.getElementById('backToTop');
        if (window.scrollY > 300) {
            btn.classList.add('show');
        } else {
            btn.classList.remove('show');
        }
    });

    function updateUrl() {
        const keyword = document.getElementById('searchInput').value.trim();
        const params = new URLSearchParams();
        if (keyword) params.set('keyword', keyword);
        if (currentPlatform !== 'ALL') params.set('platform', currentPlatform);
        if (currentAuthor) params.set('author', currentAuthor);
        if (currentPage > 1) params.set('page', currentPage);
        const newUrl = window.location.pathname + (params.toString() ? '?' + params.toString() : '');
        window.history.replaceState({}, '', newUrl);
    }

    function onSearchInput() {
        // 输入搜索关键词时自动清除作者筛选
        if (document.getElementById('searchInput').value.trim()) {
            currentAuthor = '';
        }
        applyFilters();
    }

    function clearAuthor() {
        currentAuthor = '';
        currentPage = 1;
        updateUrl();
        render();
    }

    function applyFilters() {
        currentPage = 1;
        updateUrl();
        render();
    }

    function setPlatform(platform) {
        currentPlatform = platform;
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.platform === platform);
        });
        applyFilters();
    }

    function goToPage(page) {
        currentPage = page;
        updateUrl();
        render();
    }

    function render() {
        // 显示/隐藏作者筛选标记
        const badge = document.getElementById('authorBadge');
        if (currentAuthor) {
            badge.style.display = 'flex';
            document.getElementById('authorBadgeText').textContent = (lang.startsWith('zh') ? '作者: ' : 'Author: ') + currentAuthor;
        } else {
            badge.style.display = 'none';
        }
        const keyword = document.getElementById('searchInput').value.trim();
        const filtered = B4XLib.filterLibraries(allData, {
            keyword: keyword,
            author: currentAuthor,
            platform: currentPlatform
        });
        const sorted = B4XLib.sortByDate(filtered, 'desc');
        const pagination = B4XLib.paginate(sorted, currentPage, PAGE_SIZE);
        
        B4XLib.renderLibraries(pagination.data, 'libraryList', t);
        B4XLib.renderPagination(pagination, 'pagination', goToPage, t);
    }

    async function loadData() {
        const container = document.getElementById('libraryList');
        container.innerHTML = '<div class="loading">' + t.empty.loading + '</div>';
        // stats.json 先加载（~200字节），立即更新页脚时间
        const stats = await B4XLib.loadJSON('data/stats.json');
        if (stats && stats.last_update) {
            document.getElementById('updateTime').textContent = stats.last_update;
        }
        // 然后加载库数据
        const data = await B4XLib.loadJSON('data/community.json');
        if (!data || data.length === 0) {
            container.innerHTML = '<div class="empty">' + t.empty.noData + '</div>';
            return;
        }
        allData = data;
        
        const params = new URLSearchParams(window.location.search);
        const keyword = params.get('keyword') || '';
        currentAuthor = params.get('author') || '';
        const platform = params.get('platform') || 'ALL';
        currentPage = parseInt(params.get('page')) || 1;
        if (keyword) document.getElementById('searchInput').value = keyword;
        setPlatform(platform);
    }

    applyLocale();
    document.addEventListener('DOMContentLoaded', loadData);
    </script>
</body>
</html>
