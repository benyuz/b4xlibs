<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>官方库 - B4X 资料库</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="site-header">
        <div class="logo"><img src="Logo_white.png" alt="B4X" height="35"></div>
        <nav class="main-nav">
            <a href="index.html">🏠 首页</a>
            <a href="official.html" class="active">📚 官方库</a>
            <a href="community.html">🧩 社区库</a>
        </nav>
    </header>

    <main class="container">
        <h2>📚 官方库</h2>
        <p class="subtitle">由 Erel 维护的 B4X 官方库列表</p>
        
        <div class="filter-bar">
            <input type="text" id="searchInput" placeholder="🔍 搜索库名、描述或作者..." oninput="applyFilters()">
            <div class="filter-tags">
                <button class="filter-btn active" data-platform="ALL" onclick="setPlatform('ALL')">全部</button>
                <button class="filter-btn" data-platform="B4A" onclick="setPlatform('B4A')">B4A</button>
                <button class="filter-btn" data-platform="B4I" onclick="setPlatform('B4I')">B4I</button>
                <button class="filter-btn" data-platform="B4J" onclick="setPlatform('B4J')">B4J</button>
                <button class="filter-btn" data-platform="B4R" onclick="setPlatform('B4R')">B4R</button>
            </div>
        </div>
        
        <div id="libraryList" class="library-list"><div class="loading">⏳ 加载数据中...</div></div>
    </main>

    <footer class="site-footer"><p>♥ B4X 资料库 · 数据每日自动更新</p></footer>

    <script src="js/b4x-library.js"></script>
    <script>
    let allData = [];
    let currentPlatform = 'ALL';

    function updateUrl() {
        const keyword = document.getElementById('searchInput').value.trim();
        const params = new URLSearchParams();
        if (keyword) params.set('keyword', keyword);
        if (currentPlatform !== 'ALL') params.set('platform', currentPlatform);
        const newUrl = window.location.pathname + (params.toString() ? '?' + params.toString() : '');
        window.history.replaceState({}, '', newUrl);
    }

    function applyFilters() {
        updateUrl();
        const keyword = document.getElementById('searchInput').value.trim();
        const filtered = B4XLib.filterLibraries(allData, {
            keyword: keyword,
            platform: currentPlatform
        });
        B4XLib.renderLibraries(filtered, 'libraryList');
    }

    function setPlatform(platform) {
        currentPlatform = platform;
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.platform === platform);
        });
        applyFilters();
    }

    async function loadData() {
        const container = document.getElementById('libraryList');
        container.innerHTML = '<div class="loading">⏳ 加载数据中...</div>';
        const data = await B4XLib.loadGzippedJSON('data/official.json.gz');
        if (!data || data.length === 0) {
            container.innerHTML = '<div class="empty">暂无数据</div>';
            return;
        }
        allData = data;
        
        const params = new URLSearchParams(window.location.search);
        const keyword = params.get('keyword') || '';
        const platform = params.get('platform') || 'ALL';
        if (keyword) document.getElementById('searchInput').value = keyword;
        setPlatform(platform);
    }

    document.addEventListener('DOMContentLoaded', loadData);
    </script>
</body>
</html>
