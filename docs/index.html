<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B4X Resource Navigator</title>
    <link rel="icon" type="image/png" href="favicon-32x32.png" sizes="32x32">
    <link rel="stylesheet" href="css/style.css">
</head>
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-TCVRJ6HFZE"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-TCVRJ6HFZE');
</script>
<body>
    <header class="site-header">
        <div class="header-content">
            <a href="https://www.b4x.com" target="_blank" rel="noopener" class="logo" title="B4X Official Site"><img src="Logo_white.png" alt="B4X" height="40"></a>
            <div class="header-center">
                <a href="https://benyuz.github.io/b4xlibs"><h1 id="pageTitle">📚 B4X 资源导航</h1></a>
                <p class="subtitle" id="pageSubtitle">聚合官方索引与社区集合的 B4X 库资源，一站式检索与浏览</p>
            </div>
            <div class="header-right">
                <a href="https://github.com/benyuz/b4xlibs" target="_blank" rel="noopener" class="github-link" title="GitHub">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/></svg>
                </a>
                <div class="lang-selector">
                    <select id="langSelect" onchange="changeLanguage(this.value)">
                        <option value="zh-CN">中文</option>
                        <option value="en">English</option>
                    </select>
                </div>
            </div>
        </div>
    </header>

    <main class="container">
        <section class="entry-section">
            <div class="entry-grid">
                <a href="official.html" class="entry-card official">
                    <span class="entry-number" id="statOfficial">--</span>
                    <h3 id="officialTitle">📚 官方索引</h3>
                    <p id="officialDesc">由 Erel 整理维护的 B4X 库索引</p>
                    <span class="entry-link" id="officialLink">→ 浏览全部</span>
                </a>
                <a href="community.html" class="entry-card community">
                    <span class="entry-number" id="statCommunity">--</span>
                    <h3 id="communityTitle">🧩 社区集合</h3>
                    <p id="communityDesc">由社区爱好者维护的资源集合</p>
                    <span class="entry-link" id="communityLink">→ 浏览全部</span>
                </a>
            </div>
        </section>

        <section class="ranking-section">
            <div class="ranking-header">
                <h2 id="rankingTitle">🏆 贡献者排行榜</h2>
                <div class="ranking-stats">
                    <span class="ranking-stat"><span class="stat-icon">📦</span> <span id="statTotal">--</span></span>
                    <span class="ranking-stat"><span class="stat-icon">👤</span> <span id="statAuthors">--</span></span>
                </div>
            </div>
            <div id="rankingList" class="ranking-list"><div class="loading" id="rankingLoading">加载中...</div></div>
            <div class="ranking-footer" id="rankingFooter" style="display:none">
                <button class="ranking-view-all" id="viewAllBtn" onclick="openContributorModal()">👁️ <span id="viewAllText">查看全部贡献者</span></button>
            </div>
        </section>
    </main>

    <div class="modal-overlay" id="contributorModal">
        <div class="modal">
            <div class="modal-header">
                <h3 id="modalTitle">全部贡献者</h3>
                <button class="modal-close" onclick="closeContributorModal()">✕</button>
            </div>
            <div class="modal-search">
                <input type="text" id="modalSearchInput" placeholder="搜索贡献者..." oninput="filterContributors()">
            </div>
            <div class="modal-body">
                <p class="modal-info" id="modalInfo"></p>
                <div class="modal-list" id="modalList"></div>
            </div>
        </div>
    </div>

    <footer class="site-footer">
        <p id="footerCredit">♥ B4X 由 Erel 创建 · 数据每日自动更新</p>
        <p><span id="footerUpdateLabel">🔄 更新时间：</span><span id="updateTime">--</span></p>
        <p><a href="https://github.com/benyuz/b4xlibs" id="footerGitHub"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" style="vertical-align:middle;margin-right:4px"><path d="M12 2C6.477 2 2 6.477 2 12c0 4.42 2.865 8.166 6.839 9.489.5.092.682-.217.682-.482 0-.237-.008-.866-.013-1.7-2.782.603-3.369-1.34-3.369-1.34-.454-1.156-1.11-1.463-1.11-1.463-.908-.62.069-.608.069-.608 1.003.07 1.531 1.03 1.531 1.03.892 1.529 2.341 1.087 2.91.831.092-.646.35-1.086.636-1.336-2.22-.253-4.555-1.11-4.555-4.943 0-1.091.39-1.984 1.029-2.683-.103-.253-.446-1.27.098-2.647 0 0 .84-.269 2.75 1.026A9.578 9.578 0 0112 6.836c.85.004 1.705.114 2.504.336 1.909-1.295 2.747-1.026 2.747-1.026.546 1.377.203 2.394.1 2.647.64.699 1.028 1.592 1.028 2.683 0 3.842-2.339 4.687-4.566 4.935.359.309.678.919.678 1.852 0 1.336-.012 2.415-.012 2.743 0 .267.18.578.688.48C19.138 20.163 22 16.418 22 12c0-5.523-4.477-10-10-10z"/></svg>GitHub 仓库</a></p>
    </footer>

    <button class="back-to-top" id="backToTop" onclick="scrollToTop()">TOP</button>

    <script src="js/locale.js"></script>
    <script>
    const lang = Locale.detectLanguage();
    const t = Locale.getLocale(lang);

    function applyLocale() {
        document.getElementById('langSelect').value = lang;
        document.title = t.header.pageTitle;
        document.getElementById('pageTitle').textContent = t.header.title;
        document.getElementById('pageSubtitle').textContent = t.header.subtitle;
        
        document.getElementById('officialTitle').textContent = t.entry.officialTitle;
        document.getElementById('officialDesc').textContent = t.entry.officialDesc;
        document.getElementById('officialLink').textContent = t.entry.viewAll;
        document.getElementById('communityTitle').textContent = t.entry.communityTitle;
        document.getElementById('communityDesc').textContent = t.entry.communityDesc;
        document.getElementById('communityLink').textContent = t.entry.viewAll;
        
        document.getElementById('rankingTitle').textContent = t.ranking.title;
        document.getElementById('rankingLoading').textContent = t.ranking.loading;
        document.getElementById('viewAllText').textContent = t.ranking.viewAll;
        document.getElementById('modalTitle').textContent = t.ranking.modalTitle;
        document.getElementById('modalSearchInput').placeholder = t.ranking.modalSearch;
        
        document.getElementById('footerCredit').textContent = t.footer.credit;
        document.getElementById('footerUpdateLabel').textContent = t.footer.update;
        document.getElementById('footerGitHub').innerHTML = t.footer.github;
        
        document.documentElement.lang = lang;
    }

    function changeLanguage(newLang) {
        Locale.setLanguage(newLang);
    }

    function scrollToTop() {
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    window.addEventListener('scroll', () => {
        const btn = document.getElementById('backToTop');
        if (window.scrollY > 300) {
            btn.classList.add('show');
        } else {
            btn.classList.remove('show');
        }
    });

    let allContributors = [];

    function openContributorModal() {
        document.getElementById('contributorModal').classList.add('show');
        document.body.style.overflow = 'hidden';
        renderModalList(allContributors);
    }

    function closeContributorModal() {
        document.getElementById('contributorModal').classList.remove('show');
        document.body.style.overflow = '';
        document.getElementById('modalSearchInput').value = '';
    }

    function filterContributors() {
        const keyword = document.getElementById('modalSearchInput').value.trim().toLowerCase();
        const filtered = keyword
            ? allContributors.filter(([author]) => author.toLowerCase().includes(keyword))
            : allContributors;
        renderModalList(filtered);
    }

    function renderModalList(entries) {
        const info = document.getElementById('modalInfo');
        const list = document.getElementById('modalList');
        info.textContent = t.ranking.modalCount.replace('{count}', entries.length);
        if (entries.length === 0) {
            list.innerHTML = '<div style="text-align:center;padding:24px;color:var(--text-tertiary);">' + t.ranking.noData + '</div>';
            return;
        }
        list.innerHTML = entries.map(([author, count], index) => {
            const medal = index === 0 ? '🥇' : index === 1 ? '🥈' : index === 2 ? '🥉' : (index + 1) + '.';
            const authorUrl = 'https://www.b4x.com/android/forum/pages/results/?author=' + encodeURIComponent(author) + '&prefix=1%2C2%2C3%2C17%2C24%2C29';
            return `<div class="ranking-item"><span class="rank">${medal}</span><a href="${authorUrl}" target="_blank" rel="noopener" class="author">${author}</a><span class="count">${count}${t.ranking.count || ' 个库'}</span></div>`;
        }).join('');
    }

    applyLocale();

    fetch('data/stats.json')
        .then(res => {
            if (!res.ok) throw new Error('HTTP ' + res.status);
            return res.json();
        })
        .then(stats => {
            document.getElementById('statOfficial').textContent = stats.official_count || 0;
            document.getElementById('statCommunity').textContent = stats.community_count || 0;
            document.getElementById('statTotal').textContent = stats.total_libraries || 0;
            document.getElementById('statAuthors').textContent = stats.authors?.total || 0;
            document.getElementById('updateTime').textContent = stats.last_update || '未知';

            const ranking = stats.authors?.ranking || {};
            allContributors = Object.entries(ranking).sort((a, b) => b[1] - a[1]);
            const top20 = allContributors.slice(0, 20);
            const rankingList = document.getElementById('rankingList');
            if (top20.length === 0) {
                rankingList.innerHTML = '<div>' + t.ranking.noData + '</div>';
            } else {
                let html = '';
                top20.forEach(([author, count], index) => {
                    const medal = index === 0 ? '🥇' : index === 1 ? '🥈' : index === 2 ? '🥉' : (index + 1) + '.';
                    const authorUrl = 'https://www.b4x.com/android/forum/pages/results/?author=' + encodeURIComponent(author) + '&prefix=1%2C2%2C3%2C17%2C24%2C29';
                    html += `<div class="ranking-item"><span class="rank">${medal}</span><a href="${authorUrl}" target="_blank" rel="noopener" class="author">${author}</a><span class="count">${count}${t.ranking.count || ' 个库'}</span></div>`;
                });
                rankingList.innerHTML = html;
            }
            if (allContributors.length > 20) {
                document.getElementById('rankingFooter').style.display = '';
            }
        })
        .catch(err => {
            console.error('加载统计失败:', err);
            document.getElementById('rankingList').innerHTML = '<div style="text-align:center;color:#e53e3e;padding:20px;">⚠️ ' + t.empty.failed + '</div>';
        });
    </script>
</body>
</html>
