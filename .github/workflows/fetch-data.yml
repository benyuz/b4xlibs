name: 定时抓取B4X库数据

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  fetch-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          ref: main
      - name: 安装PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: 抓取官方库
        run: php fetch/fetch_official.php
      - name: 抓取社区库
        run: php fetch/fetch_community.php
      - name: 生成统计
        run: php fetch/generate_stats.php
      - name: 提交更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/
          git diff --cached --quiet || git commit -m "自动更新数据 $(date +'%Y-%m-%d %H:%M:%S')"
          git push