name: 定时抓取B4X库数据

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 确保 data 目录存在
        run: mkdir -p docs/data

      - name: 抓取官方库
        run: python fetch/fetch_official.py
        continue-on-error: true

      - name: 抓取社区库
        run: python fetch/fetch_community.py
        continue-on-error: true

      - name: 生成统计
        run: python fetch/generate_stats.py
        continue-on-error: true

      - name: 检查并提交更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add docs/data/
          
          if git diff --cached --quiet; then
            echo "没有检测到变更，跳过提交"
          else
            git commit -m "自动更新数据 $(date +'%Y-%m-%d %H:%M:%S')"
            git push
            echo "✅ 提交并推送成功"
          fi